services:
  app:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      OLLAMA_URL: http://ollama:11434
    volumes: ["kanakku-data:/data"]
    depends_on: [ollama]
  ollama:
    image: ollama/ollama
    volumes: ["ollama-models:/root/.ollama"]
    # After first start: docker compose exec ollama ollama pull qwen2.5:7b (and the vision/embed models)

volumes:
  kanakku-data:
  ollama-models:
